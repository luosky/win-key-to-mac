<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="28" fill="#0b0b0f"/>
  <rect x="16" y="16" width="128" height="128" rx="18" fill="none" stroke="#3b3b44" stroke-width="2"/>
  <!-- Mac command symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M58 52 h28 a14 14 0 0 1 0 28 h-28 a14 14 0 0 1 0 -28 Z"/>
    <path d="M86 80 v28 a14 14 0 0 1 -28 0 v-28"/>
    <path d="M58 80 h28"/>
  </g>
  <!-- arrow to Windows key -->
  <path d="M104 52 L128 52" stroke="#ff5a5f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M122 46 L130 52 L122 58" stroke="#ff5a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Windows flag -->
  <g>
    <rect x="104" y="74" width="34" height="34" rx="4" fill="#0078d4"/>
    <path d="M121 74 v34 M104 91 h34" stroke="#0b0b0f" stroke-width="3"/>
  </g>
  <text x="80" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a9aa6">win-key-to-mac</text>
</svg>
